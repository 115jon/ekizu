name: ekizu CI
on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**ci.yml"
      - "**.hpp"
      - "**.cpp"
      - "**CMakeLists.txt"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**ci.yml"
      - "**.hpp"
      - "**.cpp"
      - "**CMakeLists.txt"

env:
  BRANCH_NAME: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
  PRERELEASE: ${{ github.ref == 'refs/heads/dev' && 'true' || 'false' }}

permissions:
  contents: write

jobs:
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.gcc-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
        config: [Release, Debug]
        gcc-version: ["g++-9", "g++-10", "g++-12"]
        os: ["ubuntu-22.04"]

    env:
      OUTPUT_NAME: ekizu-linux-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.gcc-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake ${{ matrix.gcc-version }} libssl-dev ninja-build rpm zlib1g-dev libtool autoconf linux-libc-dev

      - name: Install dependencies (vcpkg)
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: x64-linux
          cache-key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.gcc-version }}-vcpkg
          token: ${{ github.token }}
        env:
          CXX: ${{ matrix.gcc-version }}

      - name: Configure CMake
        run: cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -Dekizu_BUILD_EXAMPLES=OFF
        env:
          CXX: ${{ matrix.gcc-version }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Package
        run: cd build && cpack -C ${{ matrix.config }} --verbose

      - name: Rename Packages
        run: |
          mv build/*.deb build/${{ env.OUTPUT_NAME }}.deb
          mv build/*.rpm build/${{ env.OUTPUT_NAME }}.rpm

      - name: Upload Binary (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}.deb
          path: build/*.deb

      - name: Upload Binary (RPM)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}.rpm
          path: build/*.rpm

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        config: [Release, Debug]
        vs:
          - {name: 2019, version: 16, os: windows-2019}
          - {name: 2022, version: 17, os: windows-2022}

    name: windows-${{ matrix.arch }}-${{ matrix.config }}-vs${{ matrix.vs.name }}
    runs-on: ${{ matrix.vs.os }}

    env:
      OUTPUT_NAME: ekizu-windows-${{ matrix.arch }}-${{ matrix.config }}-vs${{ matrix.vs.name }}.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Install dependencies (vcpkg)
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.arch }}-windows
          cache-key: ${{ runner.os }}-${{ matrix.vs.name }}-${{ matrix.arch }}-vcpkg
          token: ${{ github.token }}

      - name: Configure CMake (x64)
        if: ${{ matrix.arch == 'x64' }}
        run: cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -S . -B build -G "Visual Studio ${{ matrix.vs.version }} ${{ matrix.vs.name }}" -A x64 -T host=x64 -Dekizu_BUILD_EXAMPLES=OFF

      - name: Configure CMake (x86)
        if: ${{ matrix.arch == 'x86' }}
        run: cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -S . -B build -G "Visual Studio ${{ matrix.vs.version }} ${{ matrix.vs.name }}" -A Win32 -T host=x86 -Dekizu_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Package
        run: cd build && cpack -C ${{ matrix.config }} --verbose

      - name: Rename Package
        run: mv build/*.zip build/${{ env.OUTPUT_NAME }}

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: build/${{ env.OUTPUT_NAME }}

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: ${{ env.BRANCH_NAME }}

      - name: Create Draft Release
        uses: ncipollo/release-action@v1.12.0
        with:
          prerelease: true
          draft: false
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          body: "*pending*"
          token: ${{ github.token }}

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.semver.outputs.next }}
          writeToFile: false

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          prerelease: ${{ env.PRERELEASE }}
          allowUpdates: true
          draft: false
          makeLatest: true
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

    outputs:
      next: ${{ steps.semver.outputs.next }}

  upload:
    needs: release
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file_glob: true
          file: "**/*"
          tag: ${{ needs.release.outputs.next }}
